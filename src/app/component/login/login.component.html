<section class="hero">
	<div class="background-image" style="background-image: url(assets/img/hero.png);"></div>
	<div class="card shadow-2-strong">
		<div id="shield">
			<img src="assets/img/col.png" class="logo" alt="logoescudo">
		</div>
		<form [formGroup]="formValue">
			<div class="alignleft">
				<div class="mb-3">
					<label for="exampleInputEmail1" class="form-label">Usuario</label>
					<input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Ingresa tu usuario" formControlName="email">
				</div>
				<div class="mb-1">
					<label for="exampleInputPassword1" class="form-label">Contraseña</label>
					<input type="password" class="form-control" id="exampleInputPassword1" placeholder="Contraseña" formControlName="password">
				</div>
				<div class="mb-4 form-check">
					<label class="form-check-label" for="exampleCheck1"><a href="#">Olvidé la contraseña</a></label>
				</div>
			</div>
			<button type="button" class="btn btn-primary w-100" (click)="login()">Iniciar Sesión</button>
			<!-- <label class="form-check-label" for="exampleCheck1">¿No tienes una cuenta? <a href="#">Registrate aquí</a></label> -->
		</form>
	</div>
</section>
