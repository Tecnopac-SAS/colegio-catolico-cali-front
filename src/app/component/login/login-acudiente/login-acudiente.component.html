<section class="hero">
	<div class="background-image" style="background-image: url(assets/img/hero.png);"></div>
	<div class="card shadow-2-strong">
		<div id="shield">
			<img src="assets/img/col.png" class="logo" alt="logoescudo">
		</div>
		<form [formGroup]="formValue">
			<div class="alignleft">
				<div class="mb-3">
					<label for="exampleInputEmail1" class="form-label">Usuario</label>
					<input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Ingresa tu usuario" formControlName="email">
				</div>
				<div class="mb-3">
					<label for="exampleInputPassword1" class="form-label">Contraseña</label>
					<input type="password" class="form-control" id="exampleInputPassword1" placeholder="Contraseña" formControlName="password">
				</div>
			</div>
			<div class="form-check">
				<input class="form-check-input" type="checkbox" value="" id="check" checked (change)="clearForm($event)" />
				<label class="form-check-label" for="form2Example31"> Recordar contraseña</label>
				<a routerLink="/recuperar-contrasena">Olvidé la contraseña</a>
			</div>
			<button type="submit" class="btn btn-primary w-100" (click)="login()">Iniciar Sesión</button>
            <div class="mt-3">
                <a routerLink="/login-acudiente">Solicitud de certificados </a> 
            </div>
            <div class="mt-3">
                <a routerLink="/solicitud-estudiante">Ficha de inscripción</a> 
            </div>
            <div class="mt-3">
                <a routerLink="/login-acudientea">Inscripción transporte</a> 
            </div>
        
		</form>
	</div>
</section>
