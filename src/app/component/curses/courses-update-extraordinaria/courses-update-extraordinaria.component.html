<app-dashboard>
  <app-nav-title [navTitle]="navTitle"></app-nav-title>
  <div class="content container my-xl-2">
    <div class="row">
      <div class="content-section col-md-12 mx-auto">
        <div class="card">
         <div class="card-body">
          <form [formGroup]="formValue">
            <div class="row">

              <div *ngIf="mensaje_ok">
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                  <strong>{{mensaje_ok}}</strong>
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
              </div>


              <div *ngIf="mensaje_error">
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                  <strong>{{mensaje_error}}</strong>
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"
                    (click)="cerrarAlerta()"></button>
                </div>
              </div>
              <h4>Nueva extraordinaria:</h4>
              <div class="col-md-1 my-2">
                <label class="">Asignatura</label>
              </div>

              <div class="col-md-5 my-2">
                <input type="text" class="form-control" formControlName="asignature">
              </div>


              <div class="col-md-12 my-2">
              </div>

              <div class="col-md-1">
                <label class="">Inicio</label>
              </div>

              <div class="col-md-5">
                <input type="date" class="form-control" formControlName="starDate">
              </div>

              <div class="col-md-1">
                <label class="">Fin</label>
              </div>


              <div class="col-md-5">
                <input type="date" class="form-control" formControlName="finalDate">
              </div>

              <div class="col-md-12 my-4">
              </div>
              <div class="col-md-1">
                <label class="">Valor</label>
              </div>

              <div class="col-md-5">
                <input type="number" class="form-control" formControlName="price">
              </div>

              <div class="col-md-1">
                <label class="">Docente</label>
              </div>

              <div class="col-md-5">
                <input type="text" class="form-control" formControlName="teacher">
              </div>

            </div>

            <div class="col-md-6 my-4">
              <button type="submit" class="btn btn-outline-info m-3"> Cancelar</button>

              <button type="submit" class="btn btn-primary m-3" (click)="actualizarCourse()" > Guardar</button>

            </div>

          </form>
        </div>
      </div>
      </div>
    </div>
  </div>
</app-dashboard>






<p>courses-update-extraordinaria works!</p>
