<app-dashboard>
  <app-nav-title [navTitle]="navTitle"></app-nav-title>
  <div class="content container my-xl-2">
    <div class="row">
      <div class="content-section col-md-12 mx-auto">
        <div class="card">
          <div class="card-body">
            <form [formGroup]="formValue">
              <div class="row">

                <div *ngIf="mensaje_ok">
                  <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <strong>{{mensaje_ok}}</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                  </div>
                </div>


                <div *ngIf="mensaje_error">
                  <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <strong>{{mensaje_error}}</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"
                      (click)="cerrarAlerta()"></button>
                  </div>
                </div>

                <div class="col-md-6">
                  <label>Nombres</label>
                  <input type="text" class="form-control" formControlName="name">
                </div>


                <div class="col-md-6">
                  <label>Correo</label>
                  <input type="email" class="form-control" formControlName="email">
                </div>

                <div class="role col-md-6">
                  <label>Rol</label>
                  <select class="form-control" formControlName="role">
                    <option value="" selected>SELECCIONAR</option>
                    <option *ngFor="let item of role" value="{{item.id}}">{{item.role}}</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label>Contraseña</label>
                  <input type="password" class="form-control" formControlName="password">
                </div>
              </div>

              <button type="submit" class="btn btn-outline-info my-3" (click)="CrearUsuario()"> <i
                  class="bi bi-person-plus-fill"></i> Crear usuario</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-dashboard>
