<app-dashboard>
  <div class="view">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Nombres</th>
          <th scope="col">Email</th>
          <th scope="col">Estado</th>
          <th scope="col">Rol</th>
          <th scope="col">Acciones</th>
        </tr>
      </thead>
      <tbody *ngFor="let user of dataUsers; let index = index ">
        <tr>
          <td>{{index+1}}</td>
          <td>{{user.name}}</td>
          <td>{{user.email}}</td>
          <td>{{user.isActive}}</td>
          <td>{{user.idRole}}</td>
          <td>
            <button  class="btn btn-outline-info me-2 my-2" style="width: 78px !important;" data-bs-toggle="modal" data-bs-target="#exampleModal" (click)="editUser(user)"><i class="bi bi-wrench-adjustable"></i></button>
          </td>
        </tr>


      </tbody>
    </table>
  </div>
</app-dashboard>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Modificar datos</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="formValue">
          <div class="container">

            <div class="form-group">
              <label for="exampleInputEmail1">Nombres</label>
              <input type="text" formControlName="name" class="form-control">
            </div>

            <div class="form-group">
              <label for="exampleInputPassword1">Correo</label>
              <input type="email" formControlName="email" class="form-control">
            </div>

            <div class="form-group">
              <label for="exampleInputPassword1">Contraseña</label>
              <input type="password" formControlName="password" class="form-control">
            </div>

            <div class="form-group">
              <label for="exampleInputPassword1">Rol</label>
              <input type="text" formControlName="role" class="form-control">
            </div>

            <div class="form-group">
              <label for="exampleInputPassword1">Estado</label>
              <input type="text" formControlName="isActive" class="form-control">
            </div>

          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button  type="button" class="btn btn-primary" (click)="updateUser()">Guardar cambios</button>
      </div>
    </div>
  </div>
</div>
