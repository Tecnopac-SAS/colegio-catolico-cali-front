<app-dashboard>
  <app-nav-title [navTitle]="navTitle"></app-nav-title>
  <div class="content container my-xl-2">
    <div class="row">
      <div class="content-section col-md-12 mx-auto">
        <div class="card">
          <div class="card-body">
            <form [formGroup]="formValue">
              <div class="row">

                <div *ngIf="mensaje_ok">
                  <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <strong>{{mensaje_ok}}</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                  </div>
                </div>


                <div *ngIf="mensaje_error">
                  <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <strong>{{mensaje_error}}</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"
                      (click)="cerrarAlerta()"></button>
                  </div>
                </div>
                <h5 class="text-primary py-3">Nueva matricula</h5>
                <div class="col-md-1 my-3">
                  <label class="">Grado *</label>
                </div>

                <div class="col-md-5 my-3">
                  <input type="text" class="form-control" formControlName="grade">
                </div>

                <div class="col-md-5">
                </div>

                <div class="col-md-6 my-4">
                  <label class="text-primary"><b>Ordinaria</b></label>
                </div>
                <div class="col-md-6 my-4 pl-0">
                  <label class="text-primary"><b>Extraordinaria</b></label>
                </div>

                <div class="row">
                <div class="col">
                  <div>
                      <label class="">Inicio</label>
                      <input type="date" class="form-control w-100" formControlName="startDate">
                  </div>
                  <div>
                    <label class="">Fin</label>
                    <input type="date" class="form-control w-100" formControlName="finalDate">
                  </div>
                  <div>
                    <label class="">Valor</label>
                    <input type="number" class="form-control w-100" formControlName="price">
                  </div>
                </div>
                <div class="col">
                  <div>
                    <label class="">Grado</label>
                    <input type="text" class="form-control w-100" formControlName="startDate">
                </div>
                  <div class="row">
                      <div class="col">
                        <label class="">Inicio</label>
                        <input type="date" class="form-control w-100" formControlName="startDate">
                    </div>
                    <div class="col">
                      <label class="">Fin</label>
                      <input type="date" class="form-control w-100" formControlName="finalDate">
                    </div>
                  </div>
                  <div>
                    <label class="">Valor</label>
                    <input type="number" class="form-control w-100" formControlName="price">
                  </div>
                </div>
                </div>

                

              </div>

              <div class="col-md-6 my-4">
                <button type="submit" class="btn btn-outline-primary m-3" routerLink="/matriculas"> Cancelar</button>

                <button type="submit" class="btn btn-primary m-3" (click)="CrearMatricula()"> Guardar</button>

              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-dashboard>
