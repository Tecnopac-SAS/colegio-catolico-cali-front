<form [formGroup]="miFormulario" (ngSubmit)="datos()" >
    <div *ngIf="mensaje_error">
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong class="text-primary">{{'¡Advetencia! '+mensaje_error}}</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"
          (click)="cerrarAlerta()"></button>
      </div>
    </div>
    <div class="row">
        <div class="col-12 col-xs-12  col-md-2 my-4" >
            <label class="">Nombres completos</label>
          </div>
        
          <div class="col-12 col-xs-12  col-md-4 my-4">
            <input type="text" class="form-control" formControlName="nombres" [readonly]="validadorCheck" >
          </div> 
        
           <div class="col-12 col-xs-12  col-md-2 my-4">
            <label class="">Apellidos completos</label>
          </div>
        
          <div class="col-12 col-xs-12  col-md-4 my-4">
            <input type="text" class="form-control" formControlName="apellidos" [readonly]="validadorCheck">
          </div>
        
          <div class="col-12 col-xs-12  col-md-2 my-4">
            <label class="">Nivel de estudios</label>
          </div>
        
          <div class="col-12 col-xs-12  col-md-4 my-4">
            <input type="text" class="form-control" formControlName="nivelEstudio" [readonly]="validadorCheck">
          </div>
        
          <div class="col-12 col-xs-12  col-md-2 my-4">
            <label class="">Institución educativa</label>
          </div>
        
          <div class="col-12 col-xs-12  col-md-4 my-4">
            <input type="text" class="form-control" formControlName="institucion" [readonly]="validadorCheck">
          </div> 
   
          <div class="col-12">
            <button  class="btn btn-success m-1"  (click)="CrearHermano()">Crear hermano</button>
          </div>
    </div>
    
  </form>
