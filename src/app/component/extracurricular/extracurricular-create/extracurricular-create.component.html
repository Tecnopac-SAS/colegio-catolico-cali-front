<app-dashboard>
  <app-nav-title [navTitle]="navTitle"></app-nav-title>
  <div class="content container my-xl-2">
    <div class="row">
      <div class="content-section col-md-12 mx-auto">
        <div class="cardM card">
         <div class="card-body">
          <form [formGroup]="formValue">
            <div class="row">

              <div *ngIf="mensaje_ok">
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                  <strong>{{mensaje_ok}}</strong>
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
              </div>


              <div *ngIf="mensaje_error">
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                  <strong>{{mensaje_error}}</strong>
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"
                    (click)="cerrarAlerta()"></button>
                </div>
              </div>
              <h4>Nuevo extracurricular</h4>
              <div class="card text-center" style="width: 10rem;height: 10rem">
                <div class="card-body">
                  <h5 class="card-title"></h5>
                  <p class="card-text"></p>
                  <input type="file" class="btn btn-primary form-control" formControlName="imagen">
                </div>
              </div>

              <div class="col-md-12 my-3">
                <label class=""></label>
              </div>

              <div class="col-md-1 my-3">
                <label class="">Actividad</label>
              </div>

              <div class="col-md-5 my-3">
                <input type="text" class="form-control" formControlName="activity">
              </div>

              <div class="col-md-5">
              </div>

              <div class="col-md-12 my-2">

              </div>

              <div class="col-md-1">
                <label class="">Inicio</label>
              </div>

              <div class="col-md-5">
                <input type="date" class="form-control" formControlName="startDate">
              </div>

              <div class="col-md-1">
                <label class="">Fin</label>
              </div>

              <div class="col-md-5">
                <input type="date" class="form-control" formControlName="finalDate">
              </div>

              <div class="col-md-12 my-3">

              </div>

              <div class="col-md-1">
                <label class="">Valor</label>
              </div>
              <div class="col-md-5">
                <input type="number" class="form-control" formControlName="price">
              </div>

              <div class="col-md-1">
                <label class="">Docente</label>
              </div>
              <div class="col-md-5">
                <input type="text" class="form-control" formControlName="teacher">
              </div>

              <div class="col-md-12 my-3">

              </div>

              <div class="col-md-1">
                <label class="">Información (URL)</label>
              </div>
              <div class="col-md-5">
                <input type="text" class="form-control" formControlName="information">
              </div>

              <div class="col-md-1">
                <label class="">Horario (URL)</label>
              </div>
              <div class="col-md-5">
                <input type="text" class="form-control" formControlName="schedule">
              </div>

            </div>

            <div class="col-md-6 my-4">
              <button type="submit" class="btn btn-outline-info m-3"> Cancelar</button>

              <button type="submit" class="btn btn-primary m-3" (click)="CrearExtracurricular()"> Guardar</button>

            </div>

          </form>
        </div>
      </div>
      </div>
    </div>
  </div>
</app-dashboard>
