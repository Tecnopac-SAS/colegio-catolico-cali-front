<app-dashboard>
  <app-nav-title [navTitle]="navTitle"></app-nav-title>
  <div class="content container my-xl-2">
    <div class="row">
      <div class="content-section col-md-12 mx-auto">
        <div class="card">
          <div class="card-body">
            <form [formGroup]="formValue">
              <div class="row">

                <div *ngIf="mensaje_ok">
                  <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <strong>{{mensaje_ok}}</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                  </div>
                </div>


                <div *ngIf="mensaje_error">
                  <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <strong>{{mensaje_error}}</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"
                      (click)="cerrarAlerta()"></button>
                  </div>
                </div>

                <div class="col-md-6">
                  <label>Año</label>
                  <input type="date" class="form-control" formControlName="age">
                </div>

                <div class="col-md-6">
                  <label>Identificador</label>
                  <input type="email" class="form-control" formControlName="identifier">
                </div>

                <div class="col-md-6">
                  <label>Consecutivo</label>
                  <input type="number" class="form-control" formControlName="consecutive">
                </div>

              </div>

              <button type="submit" class="btn btn-outline-primary my-3" (click)="CrearPeriodo()"> <i
                  class="bi bi-person-plus-fill"></i> Crear periodo</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-dashboard>
