<app-dashboard>
  <app-nav-title [navTitle]="navTitle"></app-nav-title>
  <div class="view">
    <table class="table table-hover table-bordered table-responsive-sm">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Año</th>
          <th scope="col">Identificador</th>
          <th scope="col">Consecutivo</th>
          <th scope="col">Estado</th>
          <th scope="col">Creado</th>
        </tr>
      </thead>
      <tbody *ngFor="let period of dataPeriod; let index = index ">
        <tr>
          <td>{{index+1}}</td>
          <td>{{period.age}}</td>
          <td>{{period.identifier}}</td>
          <td>{{period.consecutive}}</td>
          <td>{{period.isActive}}</td>
          <td>{{period.createdAt}}</td>
          <td>
            <!-- <button  class="btn btn-outline-info" style="width: 38px !important;" data-bs-toggle="modal" data-bs-target="#exampleModal" (click)="editUser(user)"><i class="bi bi-wrench-adjustable"></i></button> -->
          </td>
        </tr>


      </tbody>
    </table>
  </div>
</app-dashboard>
