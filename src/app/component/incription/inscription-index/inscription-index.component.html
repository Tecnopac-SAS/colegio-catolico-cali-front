<app-dashboard>
  <app-nav-title [navTitle]="navTitle"></app-nav-title>
  <div class="view">
    <table class="table table-hover table-bordered table-responsive-sm">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Precio</th>
          <th scope="col">Descripción<noscript></noscript></th>
          <th scope="col">Estado</th>
          <th scope="col">Fecha de creación</th>
          <th scope="col">Modificado por</th>
          <th scope="col">Periodo</th>
        </tr>
      </thead>
      <tbody *ngFor="let inscription of dataInscription; let index = index ">
        <tr>
          <td>{{index+1}}</td>
          <td>{{inscription.price}}</td>
          <td>{{inscription.description}}</td>
          <td *ngIf="inscription.isActive==0">Inactivo</td>
          <td *ngIf="inscription.isActive==1">Activo</td>
          <td>{{inscription.createdAt}}</td>
          <td>{{inscription.gradeAsUser.name}}</td>
          <td>{{inscription.gradeAsPeriod.age}}</td>
          <td>
            <!-- <button  class="btn btn-outline-info" style="width: 38px !important;" data-bs-toggle="modal" data-bs-target="#exampleModal" (click)="editUser(user)"><i class="bi bi-wrench-adjustable"></i></button> -->
          </td>
        </tr>


      </tbody>
    </table>
  </div>
</app-dashboard>
