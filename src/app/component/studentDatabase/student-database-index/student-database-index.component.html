<app-dashboard>
    <app-nav-title [navTitle]="'Base datos estudiantes'"></app-nav-title>


    <div class="container">
      <div class="my-3 row">
        <div *ngFor="let item of data" class="col-md-4 col-sm-12 mb-4 px-3" >
          <div  routerLink="{{item.url}}" class="card-home" style="background: linear-gradient(0deg, #00000073 40%, transparent 70%), url({{item.img}});">
            <h5>{{item.name}}</h5>
          </div>
        </div>
      </div>
    </div>
  </app-dashboard>
