<app-dashboard>
  <app-nav-title [navTitle]="navTitle"></app-nav-title>
  <div class="content container my-xl-2">
    <div class="row">
      <div class="content-section col-md-12 mx-auto">
        <div class="card">
         <div class="card-body">
          <form [formGroup]="formValue">
            <div class="row">

              <div *ngIf="mensaje_ok">
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                  <strong>{{mensaje_ok}}</strong>
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
              </div>


              <div *ngIf="mensaje_error">
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                  <strong>{{mensaje_error}}</strong>
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"
                    (click)="cerrarAlerta()"></button>
                </div>
              </div>
              <h5 class="text-primary">Nuevo transporte:</h5>

              <div class="col-md-12 my-2">
              </div>

              <div class="col-md-1">
                <label class="">Nombre de la ruta</label>
              </div>

              <div class="col-md-5">
                <input type="text" class="form-control" formControlName="routeName">
              </div>

              <div class="col-md-1">
                <label class="">Número de la ruta</label>
              </div>

              <div class="col-md-5">
                <input type="number" class="form-control" formControlName="routeNumber">
              </div>

              <div class="col-md-12 my-4">
              </div>
              <div class="col-md-1">
                <label class="">Responsable</label>
              </div>

              <div class="col-md-5">
                <input type="text" class="form-control" formControlName="responsible">
              </div>

              <div class="col-md-1">
                <label class="">Valor ruta</label>
              </div>

              <div class="col-md-5">
                <input type="number" class="form-control" formControlName="price">
              </div>
              <div class="col-md-12 my-4">
              </div>
              <div class="col-md-1">
                <label class="">Tipo de ruta</label>
              </div>

              <div class="col-md-5">
                <select class="form-select form-control" aria-label="Default select example" formControlName="routeType">
                  <option value="" selected>Seleccione una opción</option>
                  <option value="Media">Media</option>
                  <option value="Completa">Completa</option>
                </select>
              </div>

            </div>

            <div class="col-md-6 my-4">
              <button type="submit" class="btn btn-outline-primary m-3" routerLink="/transporte"> Cancelar</button>

              <button type="submit" class="btn btn-primary m-3" (click)="CrearTransportation()"> Guardar</button>

            </div>

          </form>
        </div>
      </div>
      </div>
    </div>
  </div>
</app-dashboard>
