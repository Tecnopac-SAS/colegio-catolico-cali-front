<app-dashboard>
  <app-nav-title [navTitle]="navTitle"></app-nav-title>
  <div class="content container my-xl-2">
    <div class="row">
      <div class="content-section col-md-12 mx-auto">
        <div class="card">
         <div class="card-body">
          <form [formGroup]="formValue">
            <div class="row p-3">
              <div *ngIf="mensaje_ok">
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                  <strong>{{mensaje_ok}}</strong>
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
              </div>

              <div *ngIf="mensaje_error">
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                  <strong>{{mensaje_error}}</strong>
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"
                    (click)="cerrarAlerta()"></button>
                </div>
              </div>
              <div class="col-sm-12 col-md-4">
                <div class="route-info" *ngFor="let item of rutaCargada" >
                  <h4>Información de la ruta</h4>
                  <span>Valor: <strong>${{ currencyUtils.formatCurrency(item.price) }}</strong></span>
                  <br>
                  <span>Cupós disponibles: <span class="badge badge-primary text-uppercase">{{item.cupo_disponible}}</span></span>
                  <br>
                  <span>Conductor o Responsable: <strong>{{ item.responsible }}</strong></span>
                  <br>
                  <span>Tipo de Ruta: <strong>{{ item.routeName }}</strong></span>
                </div>
              </div>
              <div class="col-sm-12 col-md-4">
                <label class="">Selecciona Ruta</label>
                <select class="form-select form-control" aria-label="Default select example" (change)="cargaRuta($event)" formControlName="routeid" >
                  <option value="" selected>Seleccione una opción</option>
                  <option *ngFor="let item of rutas" value="{{item.id}}">{{item.routeName}}</option>
                </select>
                <br>
                <label class="">Dirección de Recogida</label>
                <input type="text" class="form-control" placeholder="Ej: Carrera 123A #56B - 78 SUR " formControlName="direccion_recogida">
              </div>
              <div class="col-sm-12 col-md-4">
                <label class="">Selecciona Estudiante</label>
                <select class="form-select form-control" aria-label="Default select example" formControlName="estudianteid">
                  <option value="" selected>Seleccione una opción</option>
                  <option *ngFor="let item of estudiantesAsociados" value="{{item.id}}">{{ item.nombres }} {{ item.apellidos }} - {{ item.identificacion }}</option>
                </select>
                <br>
                <label class="">Dirección de Entrega</label>
                  <input type="text" class="form-control" placeholder="Ej: Carrera 123A #56B - 78 SUR " formControlName="direccion_entrega">
                  <div class="row">
                    <div class="col-auto ml-auto my-4">
                      <button type="submit" class="btn btn-outline-primary mr-2" routerLink="/acudiente-transporte"> Cancelar</button>
                      <button type="submit" class="btn btn-primary" (click)="CrearTransportation()"> Solicitar</button>
                    </div>
                  </div>
              </div>
            </div>
          </form>
        </div>
      </div>
      </div>
    </div>
  </div>
</app-dashboard>
